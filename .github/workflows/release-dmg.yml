name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Rust toolchain is available
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup default stable
          rustc -V
          cargo -V

      - name: Verify release version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Create backend virtual environment
        run: python3 -m venv backend/venv

      - name: Build DMG
        run: npm run dist:mac

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG was produced."
            exit 1
          fi

          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordvale-dmg
          path: ${{ steps.dmg.outputs.path }}

      - name: Publish DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          RELEASE_ASSET_NAME: Wordvale-macOS-arm64.dmg
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged."
            exit 0
          fi
          cp "$DMG_PATH" "$RUNNER_TEMP/$RELEASE_ASSET_NAME"
          PRERELEASE=()
          if [[ "$TAG_NAME" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG_NAME" "$RUNNER_TEMP/$RELEASE_ASSET_NAME" \
            --title "Wordvale ${TAG_NAME}" \
            --notes "Download the DMG for macOS on Apple silicon, then drag Wordvale to Applications." \
            --verify-tag "${PRERELEASE[@]}"

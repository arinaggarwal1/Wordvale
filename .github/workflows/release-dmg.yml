name: Release macOS and iOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    # macos-15 is GitHub's standard Apple silicon runner. The vendored desktop
    # runtime is arm64; do not change this to macos-15-intel.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/release-artifacts.py inspect \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.release.outputs.build_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        if: steps.release.outputs.build_required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Rust toolchain is available
        if: steps.release.outputs.build_required == 'true'
        run: |
          test "$(uname -m)" = arm64
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          rustc -V
          cargo -V

      - name: Verify release version
        if: steps.release.outputs.build_required == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Install frontend dependencies
        if: steps.release.outputs.build_required == 'true'
        run: npm ci

      - name: Create backend virtual environment
        if: steps.release.outputs.build_required == 'true'
        run: python3 -m venv backend/venv

      - name: Build DMG
        if: steps.release.outputs.build_required == 'true'
        run: npm run dist:mac

      - name: Build unsigned iOS IPA
        if: steps.release.outputs.build_required == 'true'
        run: ios/scripts/build-ipa.sh --unsigned

      - name: Stage release artifacts
        if: steps.release.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_DIR="$RUNNER_TEMP/wordvale-release"
          mkdir -p "$ASSET_DIR"
          cp "src-tauri/target/release/bundle/dmg/Wordvale_${VERSION}_arm64.dmg" "$ASSET_DIR/Wordvale-macOS-arm64.dmg"
          cp ios/dist/Wordvale-iOS.ipa "$ASSET_DIR/Wordvale-iOS.ipa"
          cd "$ASSET_DIR"
          shasum -a 256 Wordvale-macOS-arm64.dmg > Wordvale-macOS-arm64.dmg.sha256
          shasum -a 256 Wordvale-iOS.ipa > Wordvale-iOS.ipa.sha256

      - name: Save both platform artifacts
        if: steps.release.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wordvale-${{ github.ref_name }}
          path: ${{ runner.temp }}/wordvale-release/*
          if-no-files-found: error

      - name: Attach missing assets and publish workflow-owned release
        if: steps.release.outputs.publish_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/release-artifacts.py publish \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG_NAME" \
            --artifact-dir "$RUNNER_TEMP/wordvale-release"
